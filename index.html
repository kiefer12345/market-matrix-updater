<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市场数据矩阵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            background: #0d1117;
            color: #e6edf3;
            padding: 12px;
            font-size: 13px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #30363d;
        }
        
        .title {
            font-size: 16px;
            font-weight: 600;
            color: #58a6ff;
        }
        
        .update-time {
            font-size: 11px;
            color: #8b949e;
        }
        
        .matrix-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        
        th {
            background: #161b22;
            color: #8b949e;
            font-weight: 500;
            text-align: right;
            padding: 8px 10px;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            white-space: nowrap;
        }
        
        th:first-child {
            text-align: left;
            min-width: 120px;
        }
        
        td {
            padding: 6px 10px;
            text-align: right;
            border-bottom: 1px solid #21262d;
            white-space: nowrap;
        }
        
        td:first-child {
            text-align: left;
            color: #e6edf3;
            font-weight: 500;
        }
        
        tr:hover {
            background: #161b22;
        }
        
        .positive {
            color: #3fb950;
        }
        
        .negative {
            color: #f85149;
        }
        
        .neutral {
            color: #8b949e;
        }
        
        .price {
            color: #e6edf3;
            font-weight: 500;
        }
        
        /* 分类标题行 */
        .category-row {
            background: #1c2128 !important;
        }
        
        .category-row td {
            color: #58a6ff;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px;
            border-bottom: 1px solid #30363d;
        }
        
        /* 特殊指标样式 */
        .indicator-row {
            background: #1a1f24;
        }
        
        /* 迷你图标 */
        .trend-up::before {
            content: "▲ ";
            font-size: 8px;
        }
        
        .trend-down::before {
            content: "▼ ";
            font-size: 8px;
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        /* Sticky 资产名列 */
        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            z-index: 2;
        }
        th:first-child {
            background: #161b22;
        }
        td:first-child {
            background: #0d1117;
        }
        tr:hover td:first-child {
            background: #161b22;
        }
        .category-row td:first-child {
            background: #1c2128 !important;
        }
        .indicator-row td:first-child {
            background: #1a1f24;
        }

        .missing-row td { color: #8b949e; font-style: italic; }
        .missing-row td:first-child { font-style: normal; color: #8b949e; }
        .asof { font-size: 10px; color: #d29922; margin-left: 6px; font-weight: 400; }
        .footnote { margin-top: 10px; font-size: 11px; color: #8b949e; line-height: 1.6; }

        /* 列组分隔线：QTD 和 1年 左侧加边框 */
        th:nth-child(6), td:nth-child(6),
        th:nth-child(8), td:nth-child(8) {
            border-left: 1px solid #30363d;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body {
                font-size: 11px;
                padding: 8px;
            }

            th, td {
                padding: 5px 6px;
            }

            .title {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">📊 市场数据矩阵</div>
        <div class="update-time" id="updateTime">加载中...</div>
    </div>
    
    <div class="matrix-container">
        <table id="matrixTable">
            <thead>
                <tr>
                    <th>资产</th>
                    <th>收盘价</th>
                    <th>1天</th>
                    <th>1星期</th>
                    <th>1个月</th>
                    <th>QTD</th>
                    <th>YTD</th>
                    <th>1年</th>
                    <th>3年</th>
                    <th>5年</th>
                </tr>
            </thead>
            <tbody id="matrixBody">
                <tr><td colspan="10" class="loading">正在加载数据</td></tr>
            </tbody>
        </table>
    </div>
    <div class="footnote">利率与利差的变化为百分点（pp），VIX 为点数（pts），Put/Call 为比率差，其余为涨跌幅。资产名旁黄色日期表示该项数据比其他项旧，「备用源」表示主数据源失败。鼠标悬停资产名可看数据来源。</div>

    <script>
        // 分类只管分组和顺序; 单位、颜色方向、显示名全部来自 data.json 里每个资产自带的字段
        const categories = {
            "货币与利率": ["美元", "2年美债", "10年美债", "TLT"],
            "主要指数": ["标普500", "纳指", "道指", "罗素2000", "标普等权指数"],
            "风格因子": ["罗素1000价值", "罗素1000成长", "前7大科技", "趋势板块"],
            "商品": ["黄金", "WTI原油", "比特币"],
            "行业板块": ["科技", "芯片", "能源", "银行", "保险板块", "医疗", "通讯服务", "非必需品消费", "必需品消费", "公共事业", "REITS"],
            "市场情绪": ["VIX", "PUT/CALL", "垃圾债券利差"]
        };
        const PERIODS = ['1天', '1星期', '1个月', 'QTD', 'YTD', '1年', '3年', '5年'];
        const CHANGE_SUFFIX = { pp: ' pp', points: ' pts', ratio: '', '%': ' pp' };

        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        function formatLevel(value, a) {
            if (value === null || value === undefined) return '-';
            const abs = Math.abs(value);
            const num = abs >= 1000
                ? value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                : value.toFixed(abs >= 1 ? 2 : 4);
            if (a.value_type === 'yield' || a.value_type === 'spread') return num + '%';
            if (a.unit === 'USD/bbl') return '$' + num;
            return num;
        }

        function formatChange(value, a) {
            if (value === null || value === undefined) return '-';
            const sign = value > 0 ? '+' : '';
            if (a.change_type === 'absolute') return sign + value.toFixed(2) + (CHANGE_SUFFIX[a.unit] || '');
            return sign + (value * 100).toFixed(2) + '%';
        }

        function colorClass(value, invert) {
            if (value === null || value === undefined || value === 0) return 'neutral';
            return (value > 0) !== !!invert ? 'positive' : 'negative';
        }

        function renderTable(data) {
            const tbody = document.getElementById('matrixBody');
            tbody.innerHTML = '';
            const assets = data.assets || {};
            const missing = data.missing || {};
            const asOf = a => a.as_of || a.asOf;
            const latestAsOf = Object.values(assets).map(asOf).filter(Boolean).sort().pop();

            for (const [category, keys] of Object.entries(categories)) {
                const categoryRow = document.createElement('tr');
                categoryRow.className = 'category-row';
                categoryRow.innerHTML = `<td colspan="10">${category}</td>`;
                tbody.appendChild(categoryRow);

                for (const key of keys) {
                    const a = assets[key];
                    const row = document.createElement('tr');
                    if (!a) {
                        const m = missing[key];
                        const label = (m && m.label) || key;
                        const reason = (m && (m.reason || m)) || '本次未获取到数据';
                        row.className = 'missing-row';
                        row.innerHTML = `<td>${esc(label)}</td><td colspan="9" style="text-align:left">缺失：${esc(reason)}</td>`;
                        tbody.appendChild(row);
                        continue;
                    }
                    // 旧格式 data.json 没有口径字段: 旧后端全部按百分比计算, 照实按百分比显示
                    const meta = { change_type: a.change_type || 'percent', unit: a.unit, value_type: a.value_type };
                    if (a.invert_color) row.className = 'indicator-row';
                    const d = asOf(a);
                    const stale = d && latestAsOf && d < latestAsOf;
                    const tags = (stale ? `<span class="asof">${d.slice(5)}</span>` : '')
                        + (a.source_fallback ? '<span class="asof">备用源</span>' : '');
                    const tip = [a.source || a['来源'], d].filter(Boolean).join(' · ');
                    let html = `<td title="${esc(tip)}">${esc(a.label || key)}${tags}</td>`;
                    html += `<td class="price">${formatLevel(a['收盘价'], meta)}</td>`;
                    for (const p of PERIODS) {
                        const v = a[p];
                        const trend = v > 0 ? 'trend-up' : (v < 0 ? 'trend-down' : '');
                        html += `<td class="${colorClass(v, a.invert_color)} ${trend}">${formatChange(v, meta)}</td>`;
                    }
                    row.innerHTML = html;
                    tbody.appendChild(row);
                }
            }

            const updateStr = data.updateTime || '';
            let timeLabel = updateStr;
            if (updateStr) {
                // 旧格式 "YYYY-MM-DD HH:MM:SS" 也是 UTC
                const updateDate = new Date(updateStr.endsWith('Z') ? updateStr : updateStr.replace(' ', 'T') + 'Z');
                const diffMins = Math.floor((Date.now() - updateDate) / 60000);
                const diffHours = Math.floor(diffMins / 60);
                const diffDays = Math.floor(diffHours / 24);
                if (diffMins < 60) timeLabel = `${diffMins} 分钟前更新`;
                else if (diffHours < 24) timeLabel = `${diffHours} 小时前更新`;
                else timeLabel = `${diffDays} 天前更新 (${updateDate.toLocaleString('zh-CN', { hour12: false })})`;
            }
            document.getElementById('updateTime').textContent = timeLabel;
        }

        async function loadData() {
            try {
                let response = await fetch('data.json?' + Date.now()).catch(() => null);
                if (!response || !response.ok) {
                    response = await fetch('https://raw.githubusercontent.com/kiefer12345/market-matrix-updater/main/data.json?' + Date.now());
                }
                if (!response.ok) throw new Error('Failed to fetch');
                renderTable(await response.json());
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('matrixBody').innerHTML =
                    '<tr><td colspan="10" style="text-align:center;color:#f85149;">数据加载失败，请刷新重试</td></tr>';
            }
        }

        loadData();
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
