<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市场数据矩阵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            background: #ffffff;
            color: #1b2430;
            padding: 12px;
            font-size: 13px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #d6dde7;
        }
        
        .title {
            font-size: 16px;
            font-weight: 600;
            color: #1f5fbf;
        }
        
        .update-time {
            font-size: 11px;
            color: #5d6b7e;
        }
        
        /* 整页固定为一屏: 标题栏不动, 只有表格区域滚动, 表头和资产名列在滚动区里吸附 */
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; overflow: hidden; }
        .header { flex: 0 0 auto; }
        .matrix-container {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        
        th {
            background: #f6f8fb;
            color: #5d6b7e;
            font-weight: 500;
            text-align: right;
            padding: 8px 10px;
            border-bottom: 1px solid #d6dde7;
            position: sticky;
            top: 0;
            z-index: 3;
            white-space: nowrap;
        }
        
        th:first-child {
            text-align: left;
            min-width: 120px;
        }
        
        td {
            padding: 6px 10px;
            text-align: right;
            border-bottom: 1px solid #e6ebf2;
            white-space: nowrap;
        }
        
        td:first-child {
            text-align: left;
            color: #1b2430;
            font-weight: 500;
        }
        
        tr:hover {
            background: #f6f8fb;
        }
        
        .positive {
            color: #13853e;
        }
        
        .negative {
            color: #cf2b2b;
        }
        
        .neutral {
            color: #5d6b7e;
        }
        
        .price {
            color: #1b2430;
            font-weight: 500;
        }
        
        /* 分类标题行 */
        .category-row {
            background: #d9e3f0 !important;
        }
        
        .category-row td {
            color: #1f5fbf;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px;
            border-bottom: 1px solid #d6dde7;
        }
        
        /* 特殊指标样式 */
        .indicator-row {
            background: #ffffff;
        }
        
        /* 迷你图标 */
        .trend-up::before {
            content: "▲ ";
            font-size: 8px;
        }
        
        .trend-down::before {
            content: "▼ ";
            font-size: 8px;
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #5d6b7e;
        }
        
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        /* Sticky 资产名列 */
        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            z-index: 2;
        }
        th:first-child {
            background: #f6f8fb;
            z-index: 4;  /* 左上角: 同时吸附在顶部和左侧, 压在其他单元格上面 */
        }
        td:first-child {
            background: #ffffff;
        }
        tr:hover td:first-child {
            background: #f6f8fb;
        }
        .category-row td:first-child {
            background: #d9e3f0 !important;
        }
        .indicator-row td:first-child {
            background: #ffffff;
        }

        /* 冷灰间隔: 每个分类内隔行变浅蓝灰, 分类标题后重新开始; 资产名列(吸附列)同步换色 */
        tbody tr.alt td,
        tbody tr.alt td:first-child { background: #edf2f8; }
        /* 悬停高亮压过斑马纹, 方便横向对照一整行 */
        tbody tr:not(.category-row):hover td,
        tbody tr:not(.category-row):hover td:first-child { background: #d7e4f5; }

        .missing-row td { color: #5d6b7e; font-style: italic; }
        .missing-row td:first-child { font-style: normal; color: #5d6b7e; }
        .asof { font-size: 10px; color: #9a6700; margin-left: 6px; font-weight: 400; }
        .asof.newer { color: #5d6b7e; }
        .header-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
        .as-of-date { font-size: 12px; color: #1b2430; font-variant-numeric: tabular-nums; }
        .footnote {
            margin-top: 10px; padding-bottom: 12px; font-size: 11px; color: #5d6b7e; line-height: 1.6;
            position: sticky; left: 0; max-width: min(100%, calc(100vw - 32px));
        }
        .footnote a { color: #1f5fbf; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .controls { display: flex; gap: 6px; }
        .btn {
            font: inherit; font-size: 12px; color: #1b2430; background: #f6f8fb;
            border: 1px solid #d6dde7; border-radius: 6px; padding: 5px 10px;
            cursor: pointer; white-space: nowrap; min-height: 30px;
        }
        .btn:hover { background: #e6ebf2; border-color: #5d6b7e; }
        .btn:focus-visible { outline: 2px solid #1f5fbf; outline-offset: 2px; }
        .btn:disabled { opacity: 0.6; cursor: progress; }
        .btn .spin { display: inline-block; }
        .btn.loading .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .btn.loading .spin { animation: none; } }
        .toast { font-size: 11px; color: #13853e; min-height: 14px; text-align: right; }
        .toast.err { color: #cf2b2b; }
        @media (max-width: 520px) {
            .header { flex-wrap: wrap; gap: 8px; }
            .header-right { width: 100%; justify-content: space-between; }
            .header-meta { align-items: flex-start; }
        }

        /* 列组分隔线：QTD 和 1年 左侧加边框 */
        th:nth-child(6), td:nth-child(6),
        th:nth-child(8), td:nth-child(8) {
            border-left: 1px solid #d6dde7;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body {
                font-size: 11px;
                padding: 8px;
            }

            th, td {
                padding: 5px 6px;
            }

            .title {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title" id="title">📊 市场数据矩阵</div>
        <div class="header-right">
            <div class="header-meta">
                <div class="as-of-date" id="asOfDate"></div>
                <div class="update-time" id="updateTime">加载中...</div>
                <div class="toast" id="toast" aria-live="polite"></div>
            </div>
            <div class="controls">
                <button class="btn" id="refreshBtn" type="button"><span class="spin">↻</span> <span id="refreshLabel">刷新</span></button>
                <button class="btn" id="langBtn" type="button" aria-label="Switch language">EN</button>
            </div>
        </div>
    </div>

    <div class="matrix-container">
        <table id="matrixTable">
            <thead><tr id="headRow"></tr></thead>
            <tbody id="matrixBody">
                <tr><td colspan="10" class="loading">正在加载数据</td></tr>
            </tbody>
        </table>
        <div class="footnote" id="footnote"></div>
    </div>

    <script>
        // 分类只管分组和顺序; 单位、颜色方向全部来自 data.json 里每个资产自带的字段
        const CATEGORIES = [
            { zh: "货币与利率", en: "Rates & FX", keys: ["美元", "2年美债", "10年美债", "TLT"] },
            { zh: "主要指数", en: "Major Indices", keys: ["标普500", "纳指", "道指", "罗素2000", "标普等权指数"] },
            { zh: "风格因子", en: "Style Factors", keys: ["罗素1000价值", "罗素1000成长", "前7大科技", "趋势板块"] },
            { zh: "商品", en: "Commodities", keys: ["黄金", "WTI原油", "比特币"] },
            { zh: "行业板块", en: "Sectors", keys: ["科技", "芯片", "能源", "银行", "保险板块", "医疗", "通讯服务", "非必需品消费", "必需品消费", "公共事业", "REITS"] },
            { zh: "市场情绪", en: "Sentiment", keys: ["VIX", "PUT/CALL", "垃圾债券利差"] }
        ];
        // 英文显示名; 中文显示名用 data.json 里的 label
        const EN_LABELS = {
            "美元": "US Dollar Index", "2年美债": "2Y Treasury", "10年美债": "10Y Treasury", "TLT": "TLT",
            "标普500": "S&P 500 (SPY)", "纳指": "Nasdaq 100 (QQQ)", "道指": "Dow Jones (DIA)",
            "罗素2000": "Russell 2000 (IWM)", "标普等权指数": "S&P 500 Equal Wt (RSP)",
            "罗素1000价值": "Russell 1000 Value (IWD)", "罗素1000成长": "Russell 1000 Growth (IWF)",
            "前7大科技": "Magnificent 7 (MAGS)", "趋势板块": "Momentum (MTUM)",
            "黄金": "Gold (GLD)", "WTI原油": "WTI Crude Spot", "比特币": "Bitcoin",
            "科技": "Technology (XLK)", "芯片": "Semiconductors (SOXX)", "能源": "Energy (XLE)",
            "银行": "Banks (KBWB)", "保险板块": "Insurance (IAK)", "医疗": "Health Care (XLV)",
            "通讯服务": "Comm. Services (XLC)", "非必需品消费": "Cons. Discretionary (XLY)",
            "必需品消费": "Cons. Staples (XLP)", "公共事业": "Utilities (XLU)", "REITS": "REITs (IYR)",
            "VIX": "VIX", "PUT/CALL": "Total Put/Call Ratio", "垃圾债券利差": "High Yield OAS"
        };
        const PERIODS = ['1天', '1星期', '1个月', 'QTD', 'YTD', '1年', '3年', '5年'];
        const WORKFLOW_URL = 'https://github.com/kiefer12345/market-matrix-updater/actions/workflows/update_market_matrix.yml';
        const T = {
            zh: {
                pageTitle: '市场数据矩阵', title: '📊 市场数据矩阵',
                cols: ['资产', '收盘价', '1天', '1星期', '1个月', 'QTD', 'YTD', '1年', '3年', '5年'],
                weekdays: ['周日', '周一', '周二', '周三', '周四', '周五', '周六'],
                asOf: (d, w) => `数据日期 ${d}（${w}）`,
                intraday: tm => `盘中数据 · 美东 ${tm} 抓取`, lastCol: '最新价',
                mins: n => `${n} 分钟前更新`, hours: n => `${n} 小时前更新`,
                days: (n, t) => `${n} 天前更新 (${t})`, locale: 'zh-CN',
                loading: '正在加载数据', loadingShort: '加载中...',
                refresh: '刷新', refreshing: '刷新中…',
                fresh: '已是最新数据', updated: '已更新到最新数据',
                failed: '数据加载失败，请稍后再试',
                missing: '缺失：', missingDefault: '本次未获取到数据', fallback: '备用源',
                lang: 'EN',
                foot: `利率与利差的变化为百分点（pp），VIX 为点数（pts），Put/Call 为比率差，其余为涨跌幅。右上角为多数资产的数据日期；日期不同的资产会在名称旁单独标出：黄色为较旧（如 EIA、FRED 发布滞后），灰色为较新（24 小时交易的资产或盘中价）。「备用源」表示主数据源失败。鼠标悬停资产名可看数据来源。<br>「刷新」读取最新一次自动更新的结果：美股交易时段（悉尼时间约凌晨到早上）每 30 分钟更新一次盘中价，收盘后每个工作日早上再更新一次收盘价。如需立即重新抓取行情，请到 <a href="${WORKFLOW_URL}" target="_blank" rel="noopener">GitHub Actions</a> 点 Run workflow。`
            },
            en: {
                pageTitle: 'Market Data Matrix', title: '📊 Market Data Matrix',
                cols: ['Asset', 'Last', '1D', '1W', '1M', 'QTD', 'YTD', '1Y', '3Y', '5Y'],
                weekdays: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                asOf: (d, w) => `As of ${d} (${w})`,
                intraday: tm => `Intraday · fetched ${tm} ET`, lastCol: 'Last',
                mins: n => `Updated ${n} min ago`, hours: n => `Updated ${n} h ago`,
                days: (n, t) => `Updated ${n} days ago (${t})`, locale: 'en-AU',
                loading: 'Loading data', loadingShort: 'Loading...',
                refresh: 'Refresh', refreshing: 'Refreshing…',
                fresh: 'Already up to date', updated: 'Updated to latest data',
                failed: 'Failed to load data. Please try again later.',
                missing: 'Missing: ', missingDefault: 'No data in this run', fallback: 'Fallback',
                lang: '中',
                foot: `Rate and spread changes are in percentage points (pp), VIX in points (pts), Put/Call as ratio difference; everything else is % change. Top right shows the data date shared by most assets; assets with a different date are tagged next to their name: amber = older (e.g. EIA/FRED publishing lag), grey = newer (24-hour markets or intraday). "Fallback" means the primary source failed. Hover an asset name to see its source.<br>"Refresh" loads the latest scheduled update: every 30 minutes during US market hours (intraday prices), plus a closing update every weekday morning Sydney time. To re-fetch market data right now, open <a href="${WORKFLOW_URL}" target="_blank" rel="noopener">GitHub Actions</a> and click Run workflow.`
            }
        };

        let lang = 'zh';
        try { if (localStorage.getItem('mm-lang') === 'en') lang = 'en'; } catch (e) {}
        let lastData = null;
        const t = () => T[lang];
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const CHANGE_SUFFIX = { pp: ' pp', points: ' pts', ratio: '', '%': ' pp' };

        function formatLevel(value, a) {
            if (value === null || value === undefined) return '-';
            const abs = Math.abs(value);
            const num = abs >= 1000
                ? value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                : value.toFixed(abs >= 1 ? 2 : 4);
            if (a.value_type === 'yield' || a.value_type === 'spread') return num + '%';
            if (a.unit === 'USD/bbl') return '$' + num;
            return num;
        }

        function formatChange(value, a) {
            if (value === null || value === undefined) return '-';
            const sign = value > 0 ? '+' : '';
            if (a.change_type === 'absolute') return sign + value.toFixed(2) + (CHANGE_SUFFIX[a.unit] || '');
            return sign + (value * 100).toFixed(2) + '%';
        }

        function colorClass(value, invert) {
            if (value === null || value === undefined || value === 0) return 'neutral';
            return (value > 0) !== !!invert ? 'positive' : 'negative';
        }

        function labelFor(key, a, m) {
            if (lang === 'en') return EN_LABELS[key] || key;
            return (a && a.label) || (m && m.label) || key;
        }

        function applyStaticText() {
            document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
            document.title = t().pageTitle;
            document.getElementById('title').textContent = t().title;
            const cols = t().cols.slice();
            if (lastData && lastData.mode === 'intraday') cols[1] = t().lastCol;  // 盘中: 收盘价 -> 最新价
            document.getElementById('headRow').innerHTML = cols.map(c => `<th>${c}</th>`).join('');
            document.getElementById('refreshLabel').textContent = t().refresh;
            document.getElementById('langBtn').textContent = t().lang;
            document.getElementById('footnote').innerHTML = t().foot;
            if (!lastData) {
                document.getElementById('updateTime').textContent = t().loadingShort;
                document.getElementById('matrixBody').innerHTML = `<tr><td colspan="10" class="loading">${t().loading}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('matrixBody');
            tbody.innerHTML = '';
            const assets = data.assets || {};
            const missing = data.missing || {};
            const asOf = a => a.as_of || a.asOf;
            // 基准日期 = 出现次数最多的数据日期(通常是美股最近收盘日); 只有日期不同的资产才单独标注
            const counts = {};
            Object.values(assets).map(asOf).filter(Boolean).forEach(d => { counts[d] = (counts[d] || 0) + 1; });
            const baseDate = Object.keys(counts).sort((x, y) => counts[y] - counts[x] || (y > x ? 1 : -1))[0];
            let asOfText = baseDate ? t().asOf(baseDate, t().weekdays[new Date(baseDate + 'T00:00:00Z').getUTCDay()]) : '';
            if (data.mode === 'intraday' && data.updateTime) {
                const et = new Date(data.updateTime).toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false });
                asOfText = t().intraday(et);
            }
            document.getElementById('asOfDate').textContent = asOfText;

            for (const cat of CATEGORIES) {
                const categoryRow = document.createElement('tr');
                categoryRow.className = 'category-row';
                categoryRow.innerHTML = `<td colspan="10">${lang === 'en' ? cat.en : cat.zh}</td>`;
                tbody.appendChild(categoryRow);
                let rowIdx = 0;  // 每个分类重新计数

                for (const key of cat.keys) {
                    const a = assets[key];
                    const row = document.createElement('tr');
                    if (!a) {
                        if (rowIdx++ % 2 === 1) row.classList.add('alt');
                        const m = missing[key];
                        const reason = (m && (m.reason || m)) || t().missingDefault;
                        row.classList.add('missing-row');
                        row.innerHTML = `<td>${esc(labelFor(key, null, m))}</td><td colspan="9" style="text-align:left">${t().missing}${esc(reason)}</td>`;
                        tbody.appendChild(row);
                        continue;
                    }
                    // 旧格式 data.json 没有口径字段: 旧后端全部按百分比计算, 照实按百分比显示
                    const meta = { change_type: a.change_type || 'percent', unit: a.unit, value_type: a.value_type };
                    if (a.invert_color) row.classList.add('indicator-row');
                    if (rowIdx++ % 2 === 1) row.classList.add('alt');
                    const d = asOf(a);
                    const differs = d && baseDate && d !== baseDate;
                    const tags = (differs ? `<span class="asof${d > baseDate ? ' newer' : ''}">${d.slice(5)}</span>` : '')
                        + (a.source_fallback ? `<span class="asof">${t().fallback}</span>` : '');
                    const tip = [a.source || a['来源'], d].filter(Boolean).join(' · ');
                    let html = `<td title="${esc(tip)}">${esc(labelFor(key, a))}${tags}</td>`;
                    html += `<td class="price">${formatLevel(a['收盘价'], meta)}</td>`;
                    for (const p of PERIODS) {
                        const v = a[p];
                        const trend = v > 0 ? 'trend-up' : (v < 0 ? 'trend-down' : '');
                        html += `<td class="${colorClass(v, a.invert_color)} ${trend}">${formatChange(v, meta)}</td>`;
                    }
                    row.innerHTML = html;
                    tbody.appendChild(row);
                }
            }
            renderUpdateTime(data);
        }

        function renderUpdateTime(data) {
            const updateStr = data.updateTime || '';
            let timeLabel = updateStr;
            if (updateStr) {
                // 旧格式 "YYYY-MM-DD HH:MM:SS" 也是 UTC
                const updateDate = new Date(updateStr.endsWith('Z') ? updateStr : updateStr.replace(' ', 'T') + 'Z');
                const diffMins = Math.max(0, Math.floor((Date.now() - updateDate) / 60000));
                const diffHours = Math.floor(diffMins / 60);
                const diffDays = Math.floor(diffHours / 24);
                if (diffMins < 60) timeLabel = t().mins(diffMins);
                else if (diffHours < 24) timeLabel = t().hours(diffHours);
                else timeLabel = t().days(diffDays, updateDate.toLocaleString(t().locale, { hour12: false }));
            }
            document.getElementById('updateTime').textContent = timeLabel;
        }

        async function fetchData() {
            const bust = '?t=' + Date.now();
            let response = await fetch('data.json' + bust, { cache: 'no-store' }).catch(() => null);
            if (!response || !response.ok) {
                response = await fetch('https://raw.githubusercontent.com/kiefer12345/market-matrix-updater/main/data.json' + bust, { cache: 'no-store' });
            }
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
        }

        let toastTimer = null;
        function showToast(msg, isErr) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast' + (isErr ? ' err' : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.textContent = ''; }, 4000);
        }

        async function loadData(manual) {
            const btn = document.getElementById('refreshBtn');
            const prevTime = lastData && lastData.updateTime;
            if (manual) {
                btn.disabled = true; btn.classList.add('loading');
                document.getElementById('refreshLabel').textContent = t().refreshing;
            }
            try {
                lastData = await fetchData();
                applyStaticText();
                renderTable(lastData);
                if (manual) showToast(prevTime && prevTime === lastData.updateTime ? t().fresh : t().updated);
            } catch (error) {
                console.error('Error loading data:', error);
                if (lastData) showToast(t().failed, true);
                else document.getElementById('matrixBody').innerHTML =
                    `<tr><td colspan="10" style="text-align:center;color:#cf2b2b;">${t().failed}</td></tr>`;
            } finally {
                btn.disabled = false; btn.classList.remove('loading');
                document.getElementById('refreshLabel').textContent = t().refresh;
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', () => loadData(true));
        document.getElementById('langBtn').addEventListener('click', () => {
            lang = lang === 'zh' ? 'en' : 'zh';
            try { localStorage.setItem('mm-lang', lang); } catch (e) {}
            applyStaticText();
            if (lastData) renderTable(lastData);
        });

        applyStaticText();
        loadData(false);
        setInterval(() => loadData(false), 5 * 60 * 1000);
        // 标签页切回前台时更新相对时间
        document.addEventListener('visibilitychange', () => { if (!document.hidden && lastData) renderUpdateTime(lastData); });
    </script>
</body>
</html>
