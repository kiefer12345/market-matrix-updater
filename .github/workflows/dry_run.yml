name: Dry Run (PR)

# PR 上用真实数据试跑: 打印核对表并上传 data.json, 不提交、不部署、不写 Notion
on:
  pull_request:
    branches: ["main"]
    paths:
      - "market_matrix_updater.py"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas requests

      # 删掉仓库里旧的 data.json, 保证上传的只可能是本次运行生成的文件
      - name: Remove checked-in data.json
        run: rm -f data.json

      - name: Run updater (dry run)
        env:
          DRY_RUN: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -o pipefail
          python market_matrix_updater.py 2>&1 | tee dry_run_report.txt

      - name: Upload fresh output for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          path: |
            data.json
            dry_run_report.txt
          if-no-files-found: warn
